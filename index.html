<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram WebApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Shift Management System</h1>
    </header>
    <main>
        <section id="job-applications">
            <h2>Job Applications</h2>
            <form id="application-form">
                <input type="text" id="applicant-name" placeholder="Your Name" required>
                <input type="email" id="applicant-email" placeholder="Your Email" required>
                <textarea id="application-message" placeholder="Your Message" required></textarea>
                <button type="submit">Submit Application</button>
            </form>
        </section>
        <section id="payments">
            <h2>Payments</h2>
            <form id="payment-form">
                <input type="text" id="payment-amount" placeholder="Amount" required>
                <input type="text" id="payment-method" placeholder="Payment Method" required>
                <button type="submit">Make Payment</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
